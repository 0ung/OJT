<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>글 작성 - 겨울 게시판</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet"/>
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-[#f6f7f8] text-[#343A40]">
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg p-8">
        <h1 class="text-3xl font-bold mb-6 text-[#13a4ec]" id="page-title">새 글 작성</h1>

        <div class="space-y-6">
            <div>
                <label class="block text-sm font-bold mb-2">제목</label>
                <input type="text" id="title" class="w-full rounded-lg border-gray-300 focus:border-[#13a4ec] focus:ring-[#13a4ec] h-12" placeholder="제목을 입력하세요">
            </div>

            <div>
                <label class="block text-sm font-bold mb-2">내용</label>
                <textarea id="content" class="w-full rounded-lg border-gray-300 focus:border-[#13a4ec] focus:ring-[#13a4ec] h-64 resize-none" placeholder="내용을 입력하세요"></textarea>
            </div>

            <div class="flex gap-3 pt-4">
                <a href="/" class="flex-1 py-3 text-center bg-gray-100 rounded-full font-bold text-gray-600 hover:bg-gray-200">취소</a>
                <button onclick="savePost()" class="flex-1 py-3 bg-[#13a4ec] text-white rounded-full font-bold hover:bg-[#0f8bc7] transition">저장하기</button>
            </div>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    const pageTitle = document.getElementById('page-title');
    const titleInput = document.getElementById('title');
    const contentInput = document.getElementById('content');

    // 수정 모드일 경우 데이터 불러오기
    if (id) {
        pageTitle.innerText = "게시글 수정";
        fetch(`/api/boards/${id}`)
            .then(res => res.json())
            .then(data => {
                titleInput.value = data.title;
                contentInput.value = data.content;
            });
    }

    function savePost() {
        const title = titleInput.value;
        const content = contentInput.value;

        if(!title || !content) {
            alert("제목과 내용을 모두 입력해주세요.");
            return;
        }

        const url = id ? `/api/boards/${id}` : '/api/boards';
        const method = id ? 'PUT' : 'POST';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, content })
        })
        .then(res => {
            if(res.ok) {
                alert("저장되었습니다.");
                location.href = id ? `/view.html?id=${id}` : '/';
            } else {
                alert("저장 실패");
            }
        })
        .catch(err => alert("서버 오류 발생"));
    }
</script>
</body>
</html>
